# ~/.tmux.conf - starter config with sensible defaults

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# ---- Prefix key ----
# Remap prefix from Ctrl+b to Ctrl+a (closer to home row)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- General behavior ----
set -g base-index 1              # start window numbering at 1, not 0
setw -g pane-base-index 1        # start pane numbering at 1, not 0
set -g renumber-windows on       # renumber windows when one is closed
set -g history-limit 10000       # bigger scrollback buffer
set -sg escape-time 10           # reduce delay after pressing Esc (helps vim users)
set -g focus-events on           # allow apps like vim to detect focus changes
set -g set-titles on             # set terminal window title
set -g set-titles-string "#S / #W"
# set -g mouse on                  # enable mouse support
set -g mode-keys emacs           # keep emacs copy-mode keys even though EDITOR=nvim
set -g status-keys emacs

# ---- Copy mode (vi keys) ----
# setw -g mode-keys vi
# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-selection-and-cancel
# bind -T copy-mode-vi Escape send -X cancel

# ---- Splits ----
# Keep current path when splitting/creating windows
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# More intuitive split keys
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ---- Pane navigation (vim-style) ----
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- Pane resizing (repeatable with -r) ----
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- Reload config ----
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---- Status bar ----
set -g status-position bottom
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M"
set -g status-left-length 20
set -g status-right-length 40
setw -g window-status-current-style bg=blue,fg=black,bold

# ---- Activity monitoring ----
setw -g monitor-activity on
set -g visual-activity off

# Initialize TMUX plugin manager (must remain at the bottom of the tmux conf file)
run '~/.tmux/plugins/tpm/tpm'
